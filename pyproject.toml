[project]
name = "catan-rl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catanatron",
    "fastapi>=0.142.2",
    "gymnasium>=1.3.0",
    "numpy>=2.5.1",
    "torch>=2.13.0",
    "uvicorn>=0.54.0",
]

[project.optional-dependencies]
llm = [
    "peft>=0.14",
    "transformers>=4.46,<5",
]

[tool.uv.sources]
catanatron = { git = "https://github.com/bcollazo/catanatron" }

[dependency-groups]
dashboard = [
    "fastapi>=0.142.2",
    "uvicorn>=0.54.0",
]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
