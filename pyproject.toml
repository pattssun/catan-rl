[project]
name = "catan-rl"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "catanatron",
    "gymnasium>=1.3.0",
    "numpy>=2.5.1",
    "torch>=2.13.0",
]

[tool.uv.sources]
catanatron = { git = "https://github.com/bcollazo/catanatron" }

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
